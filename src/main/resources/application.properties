spring.application.name=lokora
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lokora?options=-c%20timezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lokora}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lokora}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

lokora.security.keycloak.client-id=${LOKORA_OIDC_CLIENT_ID:lokora-app}
lokora.security.keycloak.issuer-uri=${LOKORA_ISSUER_URI:http://localhost:8180/realms/lokora}

spring.security.oauth2.client.registration.keycloak.client-id=${lokora.security.keycloak.client-id}
spring.security.oauth2.client.registration.keycloak.client-secret=${LOKORA_OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${lokora.security.keycloak.issuer-uri}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${lokora.security.keycloak.issuer-uri}

spring.thymeleaf.cache=false
