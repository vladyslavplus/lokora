<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Reserve resource')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <div class="card">
        <h1 th:text="'Reserve: ' + ${resource.name()}">Reserve</h1>
        <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>
        <form th:action="@{/resources/{id}/reserve(id=${resource.id()})}" th:object="${form}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>Start (ISO-8601 with offset)
                <input type="text" th:field="*{startTime}" placeholder="2026-09-22T10:00:00+03:00">
            </label>
            <p th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></p>
            <label>End (ISO-8601 with offset)
                <input type="text" th:field="*{endTime}" placeholder="2026-09-22T11:00:00+03:00">
            </label>
            <p th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></p>
            <div class="actions">
                <button type="submit">Create reservation</button>
                <a class="button secondary" th:href="@{/resources/{id}(id=${resource.id()})}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
