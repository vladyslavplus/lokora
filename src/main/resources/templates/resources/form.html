<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${formTitle})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <div class="card">
        <h1 th:text="${formTitle}">Resource form</h1>
        <form th:action="${formAction}" th:object="${form}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="name">Name</label>
            <input id="name" th:field="*{name}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="type">Type</label>
            <select id="type" th:field="*{type}">
                <option th:each="typeOption : ${T(com.vladyslavplus.lokora.resource.ResourceType).values()}"
                        th:value="${typeOption}" th:text="${typeOption}"></option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>

            <label for="location">Location</label>
            <input id="location" th:field="*{location}">
            <p class="field-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></p>

            <label for="capacity">Capacity</label>
            <input id="capacity" type="number" min="1" th:field="*{capacity}">
            <p class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p>

            <div class="actions" style="margin-top: 1rem;">
                <button type="submit">Save</button>
                <a class="button secondary"
                   th:href="${resourceId != null} ? @{/resources/{id}(id=${resourceId})} : @{/resources}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
