databaseChangeLog:
  - changeSet:
      id: 001-create-workspace-resource
      author: lokora
      changes:
        - createTable:
            tableName: workspace_resource
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_workspace_resource
                    nullable: false
              - column:
                  name: name
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: location
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: capacity
                  type: int
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE workspace_resource
              ADD CONSTRAINT chk_workspace_resource_capacity CHECK (capacity > 0);
        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE workspace_resource
              ADD CONSTRAINT chk_workspace_resource_type CHECK (type IN ('DESK', 'MEETING_ROOM', 'PARKING_SPOT', 'EQUIPMENT'));
        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE workspace_resource
              ADD CONSTRAINT chk_workspace_resource_status CHECK (status IN ('AVAILABLE', 'MAINTENANCE', 'OUT_OF_SERVICE'));
