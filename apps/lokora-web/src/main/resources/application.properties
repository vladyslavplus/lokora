spring.application.name=lokora-web
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

lokora.security.keycloak.client-id=${LOKORA_OIDC_CLIENT_ID:lokora-app}
lokora.security.keycloak.issuer-uri=${LOKORA_ISSUER_URI:http://localhost:8180/realms/lokora}
spring.security.oauth2.client.registration.keycloak.client-id=${lokora.security.keycloak.client-id}
spring.security.oauth2.client.registration.keycloak.client-secret=${LOKORA_OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.authorization-uri=${LOKORA_OIDC_AUTHORIZATION_URI:http://localhost:8180/realms/lokora/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${LOKORA_OIDC_TOKEN_URI:http://localhost:8180/realms/lokora/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.user-info-uri=${LOKORA_OIDC_USER_INFO_URI:http://localhost:8180/realms/lokora/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${LOKORA_JWK_SET_URI:http://localhost:8180/realms/lokora/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub
spring.security.oauth2.resourceserver.jwt.issuer-uri=${lokora.security.keycloak.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${LOKORA_JWK_SET_URI:http://localhost:8180/realms/lokora/protocol/openid-connect/certs}

lokora.services.resource.base-url=${LOKORA_RESOURCE_SERVICE_URL:http://localhost:8081}
lokora.services.reservation.base-url=${LOKORA_RESERVATION_SERVICE_URL:http://localhost:8082}
lokora.services.connect-timeout=${LOKORA_DOWNSTREAM_CONNECT_TIMEOUT:2s}
lokora.services.read-timeout=${LOKORA_DOWNSTREAM_READ_TIMEOUT:5s}
spring.thymeleaf.cache=false
