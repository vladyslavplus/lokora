spring.application.name=reservation-service
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8082}

spring.datasource.url=${RESERVATION_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lokora?currentSchema=reservation_service&options=-c%20timezone=UTC}
spring.datasource.username=${RESERVATION_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:lokora}}
spring.datasource.password=${RESERVATION_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:lokora}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=reservation_service
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=reservation_service
spring.liquibase.liquibase-schema=public
spring.liquibase.database-change-log-table=databasechangelog_reservation
spring.liquibase.database-change-log-lock-table=databasechangeloglock_reservation

lokora.security.keycloak.client-id=${LOKORA_OIDC_CLIENT_ID:lokora-app}
lokora.security.keycloak.issuer-uri=${LOKORA_ISSUER_URI:http://localhost:8180/realms/lokora}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${lokora.security.keycloak.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${LOKORA_JWK_SET_URI:http://localhost:8180/realms/lokora/protocol/openid-connect/certs}

lokora.services.resource.base-url=${LOKORA_RESOURCE_SERVICE_URL:http://localhost:8081}
lokora.services.connect-timeout=${LOKORA_DOWNSTREAM_CONNECT_TIMEOUT:2s}
lokora.services.read-timeout=${LOKORA_DOWNSTREAM_READ_TIMEOUT:5s}
lokora.async.core-pool-size=2
lokora.async.max-pool-size=4
lokora.async.queue-capacity=8
lokora.async.simulation-delay=1s
lokora.async.confirmation-timeout=3s

spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.scheduler-name=lokoraScheduler
spring.quartz.overwrite-existing-jobs=false
spring.quartz.startup-delay=5s
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.threadPool.threadCount=2
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.jobStore.useProperties=true
lokora.quartz.time-zone=${LOKORA_QUARTZ_TIME_ZONE:Europe/Kyiv}
