spring.application.name=notification-service
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8083}

spring.datasource.url=${NOTIFICATION_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lokora?currentSchema=notification_service&options=-c%20timezone=UTC}
spring.datasource.username=${NOTIFICATION_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:lokora}}
spring.datasource.password=${NOTIFICATION_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:lokora}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=notification_service
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=notification_service
spring.liquibase.liquibase-schema=public
spring.liquibase.database-change-log-table=databasechangelog_notification
spring.liquibase.database-change-log-lock-table=databasechangeloglock_notification

lokora.security.keycloak.client-id=${LOKORA_OIDC_CLIENT_ID:lokora-app}
lokora.security.keycloak.issuer-uri=${LOKORA_ISSUER_URI:http://localhost:8180/realms/lokora}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${lokora.security.keycloak.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${LOKORA_JWK_SET_URI:http://localhost:8180/realms/lokora/protocol/openid-connect/certs}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:lokora}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:lokora}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
lokora.messaging.reservation-events.exchange=lokora.reservation.events
lokora.messaging.reservation-events.queue=notification-service.reservation-events
lokora.messaging.reservation-events.binding-key=reservation.*
lokora.messaging.reservation-events.dead-letter-exchange=lokora.reservation.events.dlx
lokora.messaging.reservation-events.dead-letter-queue=notification-service.reservation-events.dlq
