spring.application.name=resource-service
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}

spring.datasource.url=${RESOURCE_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lokora?currentSchema=resource_service&options=-c%20timezone=UTC}
spring.datasource.username=${RESOURCE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:lokora}}
spring.datasource.password=${RESOURCE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:lokora}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=resource_service
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=resource_service
spring.liquibase.liquibase-schema=public
spring.liquibase.database-change-log-table=databasechangelog_resource
spring.liquibase.database-change-log-lock-table=databasechangeloglock_resource

lokora.security.keycloak.client-id=${LOKORA_OIDC_CLIENT_ID:lokora-app}
lokora.security.keycloak.issuer-uri=${LOKORA_ISSUER_URI:http://localhost:8180/realms/lokora}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${lokora.security.keycloak.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${LOKORA_JWK_SET_URI:http://localhost:8180/realms/lokora/protocol/openid-connect/certs}
