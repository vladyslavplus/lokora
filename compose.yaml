services:
  postgres:
    image: postgres:17
    command: sh -c "ln -sf /usr/share/zoneinfo/Europe/Kyiv /usr/share/zoneinfo/Europe/Kiev && exec docker-entrypoint.sh postgres"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lokora}
      POSTGRES_USER: ${POSTGRES_USER:-lokora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lokora}
    ports:
      - "5433:5432"
    volumes:
      - lokora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm --http-port=8180
    env_file:
      - path: .env
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8180"
    volumes:
      - ${LOKORA_KEYCLOAK_REALM_IMPORT:-./config/keycloak/lokora-realm.json}:/opt/keycloak/data/import/lokora-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lokora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lokora}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - lokora_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  resource-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/resource-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      RESOURCE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lokora}?currentSchema=resource_service&options=-c%20timezone=UTC
      RESOURCE_DATASOURCE_USERNAME: ${POSTGRES_USER:-lokora}
      RESOURCE_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lokora}
      LOKORA_OIDC_CLIENT_ID: ${LOKORA_OIDC_CLIENT_ID:-lokora-app}
      LOKORA_ISSUER_URI: http://localhost:8180/realms/lokora
      LOKORA_JWK_SET_URI: http://keycloak:8180/realms/lokora/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  reservation-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/reservation-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      RESERVATION_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lokora}?currentSchema=reservation_service&options=-c%20timezone=UTC
      RESERVATION_DATASOURCE_USERNAME: ${POSTGRES_USER:-lokora}
      RESERVATION_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lokora}
      LOKORA_OIDC_CLIENT_ID: ${LOKORA_OIDC_CLIENT_ID:-lokora-app}
      LOKORA_ISSUER_URI: http://localhost:8180/realms/lokora
      LOKORA_JWK_SET_URI: http://keycloak:8180/realms/lokora/protocol/openid-connect/certs
      LOKORA_RESOURCE_SERVICE_URL: http://resource-service:8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-lokora}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lokora}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      resource-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  notification-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      NOTIFICATION_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lokora}?currentSchema=notification_service&options=-c%20timezone=UTC
      NOTIFICATION_DATASOURCE_USERNAME: ${POSTGRES_USER:-lokora}
      NOTIFICATION_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lokora}
      LOKORA_OIDC_CLIENT_ID: ${LOKORA_OIDC_CLIENT_ID:-lokora-app}
      LOKORA_ISSUER_URI: http://localhost:8180/realms/lokora
      LOKORA_JWK_SET_URI: http://keycloak:8180/realms/lokora/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-lokora}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lokora}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  lokora-web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/lokora-web/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_PORT: 8080
      LOKORA_OIDC_CLIENT_ID: ${LOKORA_OIDC_CLIENT_ID:-lokora-app}
      LOKORA_ISSUER_URI: http://localhost:8180/realms/lokora
      LOKORA_JWK_SET_URI: http://keycloak:8180/realms/lokora/protocol/openid-connect/certs
      LOKORA_OIDC_AUTHORIZATION_URI: http://localhost:8180/realms/lokora/protocol/openid-connect/auth
      LOKORA_OIDC_TOKEN_URI: http://keycloak:8180/realms/lokora/protocol/openid-connect/token
      LOKORA_OIDC_USER_INFO_URI: http://keycloak:8180/realms/lokora/protocol/openid-connect/userinfo
      LOKORA_RESOURCE_SERVICE_URL: http://resource-service:8081
      LOKORA_RESERVATION_SERVICE_URL: http://reservation-service:8082
    ports:
      - "8080:8080"
    depends_on:
      resource-service:
        condition: service_started
      reservation-service:
        condition: service_started

volumes:
  lokora_pg_data:
  lokora_rabbitmq_data:
